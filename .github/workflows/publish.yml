name: Publish

# Builds the package and publishes it to PyPI when a GitHub release is
# published. PyPI trusted publishing (OIDC): no token is stored anywhere.
# The PyPI project must list this repository, this workflow file and the
# "pypi" environment as a trusted publisher.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: false  # no cache in a publishing workflow
      - name: Release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/duosida_ev/__init__.py)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match __version__ $version"
            exit 1
          fi
      - run: uvx ruff check src tests tools
      - run: uvx ruff format --check src tests tools
      - run: uvx mypy --strict src
      - run: uv run --python 3.11 --with pytest pytest -q -W error::RuntimeWarning
      - run: uv run --python 3.14 --with pytest pytest -q -W error::RuntimeWarning
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/duosida-ev/
    permissions:
      id-token: write  # trusted publishing; also signs the attestations
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
